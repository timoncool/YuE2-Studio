name: Library tag publication QA
on:
  push:
    branches: [qa/atomic-library-tags]

jobs:
  concurrent-playback:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the native service
        run: cargo build --locked -p music-server --bin music-server
      - name: Verify repeated concurrent retags and playback
        env:
          PYTHONUTF8: '1'
        run: |
          Get-FileHash -Algorithm SHA256 target/debug/music-server.exe | ConvertTo-Json -Compress
          foreach ($round in 1..3) {
            Write-Output "Independent fresh service round $round"
            python -u scripts/test-library-tag-race.py target/debug/music-server.exe 65
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
