name: Windows service for instrumental cover acceptance
on:
  push:
    branches: [qa/yue2-cover-234-windows]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 1b32c3f4da73844e0b82c9f8678846ad7a914ec0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p music-server --bin music-server
      - run: |
          git rev-parse HEAD | Set-Content -Encoding utf8NoBOM revision.txt
          (Get-FileHash target/debug/music-server.exe -Algorithm SHA256).Hash | Set-Content -Encoding utf8NoBOM music-server.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cover-234-studio-windows
          retention-days: 2
          path: |
            target/debug/music-server.exe
            music-server.sha256
            revision.txt

