name: Windows service for audio.cpp ACE acceptance
on:
  push:
    branches: [qa/audio-cpp-ace-create-windows]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 94f1f0728719c7ce5daa4cb615b6f4f8c6bf7b96
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p music-server --bin music-server
      - run: |
          git rev-parse HEAD | Set-Content -Encoding utf8NoBOM revision.txt
          (Get-FileHash target/debug/music-server.exe -Algorithm SHA256).Hash | Set-Content -Encoding utf8NoBOM music-server.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: audio-cpp-ace-create-windows
          retention-days: 2
          path: |
            target/debug/music-server.exe
            music-server.sha256
            revision.txt





