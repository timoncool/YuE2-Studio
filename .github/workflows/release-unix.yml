name: macOS build

# The studio for Apple Silicon (Metal), built from the pinned engines, started
# by hand. With a tag the .dmg is attached to that release. Linux is built on
# the release machine: scripts/build-linux-docker.sh.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the builds to; empty builds only"
        required: false

concurrency:
  group: unix-builds-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # the repository pins the Windows toolchain for the release machine
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: never

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the news page's changelog is read from the history
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - name: Tools
        run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - name: Build
        run: bash scripts/build-release-macos.sh
      - name: Collect
        id: collect
        run: |
          set -e
          mkdir -p out
          version="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          product="$(node -p "require('./desktop/src-tauri/tauri.conf.json').productName")"
          dmg="$(node scripts/release-target-dir.mjs)/bundle/dmg/${product}_${version}_aarch64.dmg"
          artifact="out/YuE2-Studio-${version}-macos-arm64.dmg"
          cp "$dmg" "$artifact"
          printf 'dmg=%s\n' "$artifact" >> "$GITHUB_OUTPUT"
      - name: Verify packaged app from the mounted DMG
        env:
          DMG: ${{ steps.collect.outputs.dmg }}
        run: python3 scripts/check-macos-dmg.py "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: yue2-studio-macos-arm64
          path: ${{ steps.collect.outputs.dmg }}
      - name: Attach to the release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DMG: ${{ steps.collect.outputs.dmg }}
        run: gh release upload "$RELEASE_TAG" "$DMG" --clobber

