name: Verify a selected existing library and transcribe offline
on:
  push:
    branches: [qa/adopt-283-offline]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install service and piano dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libwayland-dev cmake fluidsynth fluid-soundfont-gm
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p music-server --bin music-server
      - name: Stage the previous Studio model, CPU package and piano
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fluidsynth fluid-soundfont-gm
          python3 .github/render_piano.py
          mkdir -p "$RUNNER_TEMP/old/data/midi/models/muscriptor-small" released
          for f in config.json model.safetensors; do
            curl -fsSL --retry 3 "https://huggingface.co/cocktailpeanut/muscriptor-small/resolve/31a8f75d6a8b5383fd71ad1371dc1620389ab722/$f" -o "$RUNNER_TEMP/old/data/midi/models/muscriptor-small/$f"
          done
          curl -fsSL --retry 3 https://github.com/timoncool/audio.cpp/releases/download/server-31cb1a4a/audiocpp-server-linux-cpu-x64.tar.gz -o released.tgz
          echo 'c8a6746c616711b3543a776c04e2de21a9d84cd1a2a522470e467a55f4032401  released.tgz' | sha256sum -c
          mv released.tgz "$RUNNER_TEMP/old/data/audiocpp-server-linux-cpu-x64.tar.gz"
      - name: Migrate Small and transcribe through the Studio API without a network interface
        run: |
          sudo env RUNNER_TEMP="$RUNNER_TEMP" QA_MIDI_SOURCE="$RUNNER_TEMP/old/data" QA_PIANO_WAV="$PWD/piano.wav" unshare -n bash -ec 'ip link set lo up; ip -br link; python3 .github/check_offline_midi.py target/debug/music-server'
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p music-server --bin music-server
      - name: Verify two real weights, an incorrect duplicate, NTFS links and a second import
        shell: pwsh
        run: |
          $env:QA_MIDI_SOURCE = Join-Path $env:RUNNER_TEMP '旧的音乐工作室'
          $models = Join-Path $env:QA_MIDI_SOURCE 'midi/models/muscriptor-small'
          New-Item -ItemType Directory -Path $models -Force | Out-Null
          foreach ($file in @('config.json', 'model.safetensors')) {
            curl.exe --fail --location --retry 3 "https://huggingface.co/cocktailpeanut/muscriptor-small/resolve/31a8f75d6a8b5383fd71ad1371dc1620389ab722/$file" --output (Join-Path $models $file)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $env:PYTHONUTF8 = '1'
          python .github/check_offline_midi.py target/debug/music-server.exe --verify-files
