name: MCP window acceptance

on:
  push:
    branches: [qa/yue2-mcp-window]

permissions:
  contents: read

jobs:
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwayland-dev cmake ffmpeg
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps --only-shell chromium
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p music-server --bin music-server
      - working-directory: app
        env:
          VITE_STUDIO_API_BASE: http://127.0.0.1:18791
        run: npm ci && npm run build
      - run: python scripts/test-mcp-window.py target/debug/music-server app/dist 18791
