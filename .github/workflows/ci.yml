name: CI

# The service's tests on Windows, the studio's own platform, and on Linux, and the interface
# type-checked, tested and built, on every branch pushed.

on:
  push:
    branches-ignore: [main]
    paths-ignore: ["docs/stars-*.svg"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      pr_run: ${{ steps.coverage.outputs.run }}
      skip_build: ${{ steps.classify.outputs.skip_build }}
      channel_changed: ${{ steps.classify.outputs.channel_changed }}
      macos_rvc_changed: ${{ steps.classify.outputs.macos_rvc_changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: coverage
        name: Find CI already testing this feature push in its pull request
        if: github.event_name == 'push' && startsWith(github.ref_name, 'music-round/') && github.ref_name != 'music-round/native-minimax-integration'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash distribution/components/find_pr_ci.sh
      - id: classify
        if: steps.coverage.outputs.run == ''
        name: Check whether only component mirrors changed
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 distribution/components/classify_ci.py
      - name: Verify independent channel publication
        if: steps.classify.outputs.publisher_test == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/channel-qa"
          "$RUNNER_TEMP/channel-qa/bin/pip" install --quiet 'tuf==7.0.1' 'securesystemslib[crypto]==1.6.0'
          "$RUNNER_TEMP/channel-qa/bin/python" distribution/components/test_stage_channel.py

  service:
    needs: changes
    if: ${{ needs.changes.outputs.pr_run == '' && needs.changes.outputs.skip_build != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2
      - name: YuE2 training and checkpoints
        run: cargo test --locked -p music-engine --lib yue_train::tests
      - name: Service tests
        run: cargo test -p music-server --locked
      - name: OpenRouter music service against local SSE
        run: python scripts/test-openrouter-music.py target/debug/music-server.exe

  # the same tests on Linux, the platform the studio's Linux package runs on; the repository's toolchain file names
  # the Windows one, so the runner's own stable toolchain is taken
  service-linux:
    needs: changes
    if: ${{ needs.changes.outputs.pr_run == '' && needs.changes.outputs.skip_build != 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
      - name: System libraries (the file dialog's Wayland, FLAC's CMake)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libwayland-dev cmake
      - uses: Swatinem/rust-cache@v2
      - name: YuE2 training and checkpoints
        run: cargo test --locked -p music-engine --lib yue_train::tests
      - name: Service tests
        run: cargo test -p music-server --locked

      - name: Install ONNX through two signed mirror revisions
        if: needs.changes.outputs.channel_changed == 'true'
        run: bash distribution/components/check_installed_channel.sh target/debug/music-server

  service-macos-rvc:
    needs: changes
    if: needs.changes.outputs.macos_rvc_changed == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2
      - name: Select and install the verified CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          archive="$RUNNER_TEMP/vocal-fast-macos-arm64-cpu.tar.gz"
          pins=crates/music-server/src/rvc_fast_assets.json
          curl --fail --location --retry 3 --silent --show-error \
            "$(jq -er '.macos_cpu.url' "$pins")" -o "$archive"
          printf '%s  %s\n' "$(jq -er '.macos_cpu.sha256' "$pins")" "$archive" | shasum -a 256 --check
          cargo test --locked -p music-server --lib rvc_fast
          YUE2_MACOS_RVC_ARCHIVE="$archive" cargo test --locked -p music-server --lib \
            installs_the_macos_cpu_archive_with_its_loader_dependencies -- --ignored
      - name: Verify passive status through MCP
        shell: bash
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/rvc-macos-clean"
          cargo build --locked -p music-server
          YUE_STUDIO_DATA_ROOT="$profile" YUE_STUDIO_PORT=18791 \
            target/debug/music-server > "$RUNNER_TEMP/rvc-macos-studio.log" 2>&1 &
          studio=$!
          trap 'status=$?; kill "$studio" 2>/dev/null || true; if (( status )); then cat "$RUNNER_TEMP/rvc-macos-studio.log"; fi' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18791/health >/dev/null; then break; fi
            sleep 1
          done
          mcp_call() {
            jq -nc --arg name "$1" '{jsonrpc:"2.0",id:1,method:"tools/call",params:{name:$name,arguments:{}}}' |
              curl --fail --silent --show-error --max-time 20 \
                -H 'Content-Type: application/json' --data-binary @- http://127.0.0.1:18791/mcp |
              jq -e '.result | select(.isError != true) | .structuredContent'
          }
          mcp_call rvc_native_runtime_status |
            jq -e '.supported == true and .backend == "cpu-graph" and .installed == false and .missing_bytes > 0'
          mcp_call rvc_backend_status |
            jq -e '.backends["vocal-fast-rs"] | .runtime == "cpu-graph" and .ready == false and .can_start == false'
          test ! -e "$profile/rvc/native/cache-v1"

  interface:
    needs: changes
    if: ${{ needs.changes.outputs.pr_run == '' && needs.changes.outputs.skip_build != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the news page's changelog is read from the history
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Types
        run: npx tsc --noEmit -p .
      - name: Tests
        run: npm test
