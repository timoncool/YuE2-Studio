name: Windows library acceptance
on:
  push:
    branches: [qa/rename-library-76e1e25-windows]
permissions:
  contents: read
jobs:
  library:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p music-server --bin music-server
      - run: python .github/check-yue-gpu-targets.py target/debug/music-server.exe
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: npm run predev
        working-directory: app
      - run: python -m pip install playwright imageio-ffmpeg requests
      - run: python .github/check-library-rename.py
