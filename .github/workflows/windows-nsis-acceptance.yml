name: Windows NSIS release acceptance

on:
  push:
    branches: [qa/yue2-windows-nsis-upgrade]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    permissions:
      contents: write # GitHub requires push access for an unpublished draft.
    strategy:
      fail-fast: false
      matrix:
        scenario: [clean, upgrade]
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        if: matrix.scenario == 'clean'
        with:
          node-version: '24'
      - name: Read pinned files from the unpublished v5.0.0 draft
        env:
          GH_TOKEN: ${{ github.token }}
          QA_DIR: ${{ runner.temp }}/nsis-qa
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          "QA_DIR=$env:QA_DIR" >> $env:GITHUB_ENV
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 binary redirection required' }
          $repo = $env:GITHUB_REPOSITORY
          $draft = gh api "repos/$repo/releases/453516878" | ConvertFrom-Json
          if (!$draft.draft -or $draft.tag_name -cne 'v5.0.0') { throw 'Expected unpublished v5.0.0 draft 453516878' }
          $directory = New-Item -ItemType Directory -Path $env:QA_DIR
          $package = 'YuE2.Studio_5.0.0_x64-setup.exe'
          $pinned = [ordered]@{
            'YuE2.Studio_5.0.0_x64-setup.exe' = '5ab138470a9861891f6c53d71bbfefcb667d583b6fa3dc13e80718f347ce2d81'
            'YuE2.Studio_5.0.0_x64-setup.exe.sig' = '99313d9f1ebfbd90abd4a84890ff7a719dc2b3597f98687dac5fc9cbd0a798cc'
            'windows-rc-receipt.json' = '12bcc795b7d1db36523e9fd76389b1f02939bfc30e099a0fd10564bbd3531fa8'
          }
          $evidence = [ordered]@{ release_id = $draft.id; assets = [ordered]@{} }
          foreach ($name in $pinned.Keys) {
            $selected = @($draft.assets | Where-Object { $_.name -ceq $name -and $_.state -eq 'uploaded' })
            if ($selected.Count -ne 1) { throw "Draft $($draft.id) has $($selected.Count) uploaded copies of $name" }
            $asset = $selected[0]
            $path = Join-Path $directory.FullName $name
            gh api -H 'Accept: application/octet-stream' "repos/$repo/releases/assets/$($asset.id)" > $path
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ((Get-Item -LiteralPath $path).Length -ne $asset.size -or "sha256:$actual" -cne $asset.digest -or $actual -cne $pinned[$name]) {
              throw "$name does not match the draft metadata and pinned SHA-256"
            }
            $evidence.assets[$name] = [ordered]@{ id = $asset.id; bytes = $asset.size; sha256 = $actual }
          }
          $receipt = Get-Content -LiteralPath (Join-Path $directory.FullName 'windows-rc-receipt.json') -Raw | ConvertFrom-Json
          if ($receipt.revision -cne '34b3fe4676683fffe90229f4bd396524ef0d5967') { throw 'Unexpected source revision in staging receipt' }
          if ($receipt.installer_sha256 -ine $evidence.assets[$package].sha256) { throw 'Installer SHA-256 does not match the staging receipt' }
          $evidence | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $directory.FullName 'draft.json')
      - name: Download public verification tooling and baseline
        run: python scripts/windows-nsis-acceptance.py download ${{ matrix.scenario }}
      - name: Verify and exercise installed Studio
        id: installed-studio
        run: python scripts/windows-nsis-acceptance.py verify ${{ matrix.scenario }}
      - name: Exercise installed Windows screens through Studio MCP
        id: installed-screens
        if: matrix.scenario == 'clean'
        env:
          PYTHONUTF8: '1'
          STUDIO_QA_REAL_SHELL_PROFILE: '1'
        run: |
          $exe = Join-Path $env:QA_DIR 'installed/YuE2-Studio.exe'
          python -u scripts/test-hosted-webview-screens.py $exe (Join-Path $env:QA_DIR 'evidence/screens') --suite screens
      - name: Exercise installed Native LRC Save As
        if: always() && (steps.installed-screens.outcome == 'success' || steps.installed-screens.outcome == 'failure')
        env:
          PYTHONUTF8: '1'
          STUDIO_QA_REAL_SHELL_PROFILE: '1'
        run: |
          $exe = Join-Path $env:QA_DIR 'installed/YuE2-Studio.exe'
          python -u scripts/test-hosted-webview-screens.py $exe (Join-Path $env:QA_DIR 'evidence/native-lrc') --suite lrc
      - name: Verify public TUF channel online and offline on the clean installation
        if: always() && matrix.scenario == 'clean' && steps.installed-studio.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip --disable-pip-version-check install 'tuf==7.0.1' 'securesystemslib[crypto]==1.6.0'
          $exe = Join-Path $env:QA_DIR 'installed/YuE2-Studio.exe'
          $report = Get-Content -Raw -LiteralPath (Join-Path $env:QA_DIR 'evidence/acceptance.json') | ConvertFrom-Json
          $sha = $report.installed_files_sha256.'yue2-studio.exe'
          if ($sha -cnotmatch '^[a-f0-9]{64}$') { throw 'Verified installed executable pin is missing' }
          $work = Join-Path $env:QA_DIR 'public-channel-work'
          $evidence = New-Item -ItemType Directory -Path (Join-Path $env:QA_DIR 'evidence/public-channel')
          $argsForProbe = @('--executable', $exe, '--executable-sha', $sha, '--work', $work,
                            '--public-receipt', 'scripts/component-channel-v2-pinned.json')
          try {
            python -u scripts/prove-public-channel-rc.py online @argsForProbe
            python -u scripts/prove-public-channel-rc.py offline @argsForProbe
            $manifest = Get-Content -Raw -LiteralPath 'scripts/component-channel-v2-pinned.json' | ConvertFrom-Json
            $response = Invoke-WebRequest ($manifest.base + 'timestamp.json')
            $received = (Get-FileHash -InputStream $response.RawContentStream -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($received -cne $manifest.files.'timestamp.json'.sha256) { throw 'Runner cannot see the pinned public channel after offline QA' }
            "Runner public HTTPS remained available: $received" | Set-Content -LiteralPath (Join-Path $evidence.FullName 'runner-network.txt')
          } finally {
            foreach ($name in @('online.log', 'offline.log', 'public-channel.json')) {
              $path = Join-Path $work $name
              if (Test-Path -LiteralPath $path) { Copy-Item -LiteralPath $path -Destination $evidence.FullName }
            }
          }
      - name: Install both public signed engines from the installed WebView
        if: always() && matrix.scenario == 'clean' && steps.installed-studio.outcome == 'success'
        env:
          PYTHONUTF8: '1'
          STUDIO_QA_REAL_SHELL_PROFILE: '1'
        run: |
          $exe = Join-Path $env:QA_DIR 'installed/YuE2-Studio.exe'
          python -u scripts/test-hosted-webview-screens.py $exe (Join-Path $env:QA_DIR 'evidence/engine-first-install') --suite engine-install
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-nsis-${{ matrix.scenario }}
          path: ${{ runner.temp }}/nsis-qa/evidence/**
