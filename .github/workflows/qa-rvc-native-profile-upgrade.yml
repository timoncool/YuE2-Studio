name: Windows service for RVC profile upgrade acceptance
on:
  push:
    branches: [qa/rvc-native-profile-upgrade]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 3f3bc6d4847e829badf768c458f66cde98f4d250
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p music-server --bin music-server
      - run: |
          git rev-parse HEAD | Set-Content -Encoding utf8NoBOM revision.txt
          (Get-FileHash target/debug/music-server.exe -Algorithm SHA256).Hash | Set-Content -Encoding utf8NoBOM music-server.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rvc-native-profile-upgrade-windows
          retention-days: 2
          path: |
            target/debug/music-server.exe
            music-server.sha256
            revision.txt



