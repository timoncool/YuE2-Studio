name: MiniMax-H3 MCP acceptance

on:
  push:
    branches: [qa/yue2-create-keyboard]

permissions:
  contents: read

jobs:
  h3-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install service dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwayland-dev cmake
      - uses: Swatinem/rust-cache@v2
      - name: Build the standalone Studio service
        run: cargo build --locked -p music-server --bin music-server
      - name: Read the experimental entry through MCP
        run: python scripts/test-h3-mcp.py target/debug/music-server 18791
