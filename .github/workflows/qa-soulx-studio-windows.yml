name: Verify the published SoulX runtime install

on:
  push:
    branches: [qa/soulx-studio-windows]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          ref: 30505a3eef88b77f3975e2ac6cba5afb5416cc80
          path: studio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio
      - run: cargo build --locked -p music-server --bin music-server
        working-directory: studio
      - run: python -u scripts/qa-soulx-published-install.py
      - uses: actions/upload-artifact@v4
        with:
          name: soulx-published-install
          retention-days: 5
          path: soulx-published-install.json

