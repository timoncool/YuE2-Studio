name: Windows service for YuE2 sampling acceptance
on:
  push:
    branches: [qa/native-sampling-acceptance]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 6da58e0a85e649b599dd751fa4b0c8eef6bb6cf2
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p music-server --bin music-server
      - run: |
          git rev-parse HEAD | Set-Content -Encoding utf8NoBOM revision.txt
          (Get-FileHash target/debug/music-server.exe -Algorithm SHA256).Hash | Set-Content -Encoding utf8NoBOM music-server.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sampling-acceptance-windows
          retention-days: 2
          path: |
            target/debug/music-server.exe
            music-server.sha256
            revision.txt



