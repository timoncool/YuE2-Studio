name: macos-window-check

# The released .dmg on a Mac as a user gets it: mounted, the app started, its window opened, and the studio asked
# through its MCP as an agent would - version, the open window, the first screen read back.
# Runs only from this artifact acceptance branch.
on:
  push:
    branches: [qa/yue2-500-dmg-window]

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      VERSION: "5.0.0"
      APP: "YuE2 Studio"
      DMG: "YuE2-Studio-5.0.0-macos-arm64.dmg"
      BUILD_RUN: "44885352475"
      BUILD_SHA: "9e50a4b0dc1240bf573ad19009eba5e59aaf17ab"
      DMG_SHA256: "8aeff76ffde1d7a24dab053f7b7bb61d1bf9a014873d8fde4bfa425d108ec419"
      PORT: "8791"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The dmg, mounted and copied out
        run: |
          [ "$(gh run view "$BUILD_RUN" -R "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$BUILD_SHA" ]
          gh run download "$BUILD_RUN" -R "$GITHUB_REPOSITORY" -n yue2-studio-macos-arm64 -D "$RUNNER_TEMP"
          printf '%s  %s\n' "$DMG_SHA256" "$RUNNER_TEMP/$DMG" | shasum -a 256 -c -
          hdiutil attach -nobrowse -noautoopen -readonly -mountpoint /Volumes/studio "$RUNNER_TEMP/$DMG"
          trap 'hdiutil detach /Volumes/studio || hdiutil detach -force /Volumes/studio' EXIT
          ditto "/Volumes/studio/$APP.app" "$RUNNER_TEMP/$APP.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/$APP.app"
          ls "$RUNNER_TEMP/$APP.app/Contents/MacOS"
          file "$RUNNER_TEMP/$APP.app/Contents/MacOS/"* | head -5
      - name: The app started, its service answers
        run: |
          bin="$(ls "$RUNNER_TEMP/$APP.app/Contents/MacOS" | grep -i studio | head -1)"
          nohup "$RUNNER_TEMP/$APP.app/Contents/MacOS/$bin" > "$RUNNER_TEMP/run.log" 2>&1 &
          for i in $(seq 1 120); do
            code=$(curl -s -m 2 -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/" || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ] || { echo "[ERROR] no answer on $PORT"; tail -50 "$RUNNER_TEMP/run.log"; exit 1; }
          echo "[OK] the service answers on $PORT"
      - name: Version, window and screens through MCP
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/window-receipt"
          mkdir -p "$receipt"
          printf 'build_run=%s\nbuild_sha=%s\ndmg_sha256=%s\n' "$BUILD_RUN" "$BUILD_SHA" "$DMG_SHA256" > "$receipt/source.txt"
          u="http://127.0.0.1:$PORT/mcp"
          H=(-H "content-type: application/json" -H "accept: application/json, text/event-stream")
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"macos-window-check","version":"1"}}}'
          curl -s -m 30 -D headers.txt -o init.txt "${H[@]}" -d "$init" "$u"
          sid=$(grep -i '^mcp-session-id:' headers.txt | tr -d '\r' | awk '{print $2}')
          S=(); [ -n "$sid" ] && S=(-H "mcp-session-id: $sid")
          curl -s -m 30 -o /dev/null "${H[@]}" "${S[@]}" -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' "$u"
          sed 's/^data: //' init.txt | grep -oE '"version":"[0-9.]+"' | tail -1
          sed 's/^data: //' init.txt | grep -q "\"version\":\"$VERSION\"" || { echo "[ERROR] the studio is not $VERSION"; head -c 600 init.txt; exit 1; }
          call() { curl -s -m 60 "${H[@]}" "${S[@]}" -d "{\"jsonrpc\":\"2.0\",\"id\":9,\"method\":\"tools/call\",\"params\":{\"name\":\"$1\",\"arguments\":$2}}" "$u" | sed 's/^data: //' | grep -v '^event:' | grep -v '^$'; }
          text() { node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);if(r.error||r.result?.isError){console.error(s);process.exit(1)}process.stdout.write(r.result.content[0].text)})"; }
          for i in $(seq 1 30); do
            call studio_status '{}' | text > status.txt
            grep -q '"window_open": true' status.txt && break
            sleep 2
          done
          head -c 400 status.txt; echo
          grep -q '"window_open": true' status.txt || { echo "[ERROR] the window did not open"; exit 1; }
          cp status.txt init.txt "$receipt/"
          call ui_read_page '{}' | text > "$receipt/start.txt"
          [ "$(awk 'END {print NR}' "$receipt/start.txt")" -gt 5 ]
          screencapture -x "$receipt/window.png"
          test -s "$receipt/window.png"
          for view in create library search playlist adapters tools news; do
            call ui_navigate "{\"view\":\"$view\"}" | text > "$receipt/navigate-$view.txt"
            call ui_read_page '{}' | text > "$receipt/$view.txt"
            lines=$(awk 'END {print NR}' "$receipt/$view.txt")
            printf '%s: %s lines\n' "$view" "$lines" | tee -a "$receipt/screens.txt"
            [ "$lines" -gt 5 ]
          done
          if [ "$(shasum -a 256 "$receipt/"{create,library,search,playlist,adapters,tools,news}.txt | awk '{print $1}' | sort -u | wc -l)" -ne 7 ]; then
            echo 'Expected seven distinct navigation screens' >&2
            exit 1
          fi
          echo "[OK] $APP $VERSION: window open and seven pages read through MCP"
      - name: Without a window, and stopped by --stop
        run: |
          bin="$(ls "$RUNNER_TEMP/$APP.app/Contents/MacOS" | grep -i studio | head -1)"
          exe="$RUNNER_TEMP/$APP.app/Contents/MacOS/$bin"
          pkill -f "$APP.app/Contents/MacOS" || true
          for i in $(seq 1 30); do curl -s -m 2 -o /dev/null "http://127.0.0.1:$PORT/health" || break; sleep 1; done
          nohup "$exe" --headless > "$RUNNER_TEMP/headless.log" 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -m 2 -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/health" || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ] || { echo "[ERROR] --headless: no answer on $PORT"; tail -40 "$RUNNER_TEMP/headless.log"; exit 1; }
          echo "[OK] --headless: the service answers"
          "$exe" --stop || echo "[..] --stop exit $?"
          for i in $(seq 1 30); do
            curl -s -m 2 -o /dev/null "http://127.0.0.1:$PORT/health" || { echo "[OK] --stop ended the studio"; exit 0; }
            sleep 1
          done
          echo "[ERROR] the studio still answers after --stop"; tail -40 "$RUNNER_TEMP/headless.log"; exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-window-${{ env.VERSION }}
          path: ${{ runner.temp }}/window-receipt
          retention-days: 1
      - name: The app's log
        if: always()
        run: tail -40 "$RUNNER_TEMP/run.log" || true
