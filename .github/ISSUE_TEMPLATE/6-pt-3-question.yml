name: Pergunta
description: Como fazer alguma coisa, ou algo não está claro
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: A sua pergunta
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do YuE2 Studio
      description: "**Definições → Sobre**"
  - type: input
    id: os
    attributes:
      label: Sistema
      placeholder: "Windows 11 · macOS 15.4 · Ubuntu 24.04"
  - type: input
    id: gpu
    attributes:
      label: Placa gráfica
      placeholder: "RTX 4060 8 GB · Apple M3 16 GB · sem GPU"
